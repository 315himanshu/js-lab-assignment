<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Practical Lab 3</title>
</head>

<body>

    <h1>JavaScript Practical Lab 3</h1>
    <h2>Variables, Data Types & Operators</h2>

    <script>

        // Part 0
        console.log("----- PART 0 -----");

        console.log(typeof (10 + "5"));
        console.log(5 === "5");

        let x = 10;
        x += 5;
        console.log(x);

        console.log(true && false || true);
        console.log(10 % 3);


        // Part 1
        console.log("----- PART 1 -----");

        let val = 4 + 3 * 2 ** 2 - 6 / 3;
        console.log("Task 1.1:", val);

        console.log("Task 1.2:");
        console.log(1 < 2 < 3);
        console.log(3 > 2 > 1);

        let expression = 5 + 3 * 2 > 10 && 20 - 5 === 15;
        console.log("Task 1.3:", expression);


        // Part 2
        console.log("----- PART 2 -----");

        let age = 25;

        let ticketPrice = age < 5
            ? "Free"
            : age < 12
                ? "₹100"
                : age < 60
                    ? "₹250"
                    : "₹150";

        console.log("Task 2.1:", ticketPrice);

        let cartTotal = 1500;

        let shippingCost = cartTotal >= 2000
            ? "Free Shipping"
            : cartTotal >= 1000
                ? "₹50"
                : "₹100";

        console.log("Task 2.2:", shippingCost);

        let isMember = true;
        let totalSpent = 6000;

        let discountType = isMember && totalSpent >= 5000
            ? "VIP Discount"
            : totalSpent >= 5000
                ? "Regular Discount"
                : "No Discount";

        console.log("Task 2.3:", discountType);


        // Part 3
        console.log("----- PART 3 -----");

        const scores = [70, 80, 65, 90, 75];

        const sum = scores[0] + scores[1] + scores[2] + scores[3] + scores[4];

        const average = sum / scores.length;

        const result = average >= 40 ? "Pass" : "Fail";

        console.log("Sum:", sum);
        console.log("Average:", average);
        console.log("Result:", result);


        const item1 = {
            name: "Notebook",
            price: 60,
            qty: 3
        };

        const item2 = {
            name: "Pen",
            price: 10,
            qty: 5
        };

        const item3 = {
            name: "Bag",
            price: 800,
            qty: 1
        };

        const item4 = {
            name: "Bottle",
            price: 300,
            qty: 2
        };

        const subtotal1 = item1.price * item1.qty;
        const subtotal2 = item2.price * item2.qty;
        const subtotal3 = item3.price * item3.qty;
        const subtotal4 = item4.price * item4.qty;

        const grandTotal = subtotal1 + subtotal2 + subtotal3 + subtotal4;

        console.log("Grand Total:", grandTotal);


        // Part 4
        console.log("----- PART 4 -----");

        console.log("5" + 3);
        console.log("5" - 3);
        console.log("abc" * 2);
        console.log(NaN === NaN);
        console.log([] == false);
        console.log("10" == 10);
        console.log(null + 1);

        console.log("typeof NaN:", typeof NaN);


        // Part 5 - Billing System
        console.log("----- PART 5: BILLING SYSTEM -----");

        const product1 = {
            name: "Notebook",
            price: 60,
            qty: 3
        };

        const product2 = {
            name: "Pen",
            price: 10,
            qty: 5
        };

        const product3 = {
            name: "Bag",
            price: 800,
            qty: 1
        };

        console.log("Price Type 1:", typeof product1.price);
        console.log("Price Type 2:", typeof product2.price);
        console.log("Price Type 3:", typeof product3.price);

        const productSubtotal1 = product1.price * product1.qty;
        const productSubtotal2 = product2.price * product2.qty;
        const productSubtotal3 = product3.price * product3.qty;

        const total = productSubtotal1 + productSubtotal2 + productSubtotal3;

        const discountPercent = total >= 5000
            ? 20
            : total >= 2000
                ? 10
                : total >= 1000
                    ? 5
                    : 0;

        const discountAmount = total * discountPercent / 100;

        const afterDiscount = total - discountAmount;

        const gst = afterDiscount * 18 / 100;

        const finalAmount = afterDiscount + gst;

        const freeShipping = afterDiscount >= 1500 || 3 >= 3;

        const shipping = freeShipping
            ? "FREE"
            : "₹100 shipping charge";

        console.log("----- RECEIPT -----");

        console.log(product1.name + " - ₹" + productSubtotal1);
        console.log(product2.name + " - ₹" + productSubtotal2);
        console.log(product3.name + " - ₹" + productSubtotal3);

        console.log("Grand Total: ₹" + total);
        console.log("Discount: " + discountPercent + "%");
        console.log("Discount Amount: ₹" + discountAmount.toFixed(2));
        console.log("After Discount: ₹" + afterDiscount.toFixed(2));
        console.log("GST: ₹" + gst.toFixed(2));
        console.log("Final Payable: ₹" + finalAmount.toFixed(2));
        console.log("Shipping: " + shipping);


        // Bonus
        const loyaltyPoints = finalAmount / 100;

        console.log("Loyalty Points:", loyaltyPoints);


        // Part 6 - Debugging
        console.log("----- PART 6 -----");

        // Snippet 1
        let price = 500;
        let discount = price * 0.1;
        discount = discount + 5;

        console.log("Final:", discount);


        // Snippet 2
        let marks = "85";

        let passResult = marks === "85"
            ? "Pass"
            : "Fail";

        console.log(passResult);


        // Snippet 3
        const originalCartTotal = 1200;

        let newCartTotal = originalCartTotal - 100;

        let shippingResult = newCartTotal >= 1500
            ? "Free"
            : "Paid";

        console.log(shippingResult);

    </script>

</body>

</html>
